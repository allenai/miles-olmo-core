version: v2
budget: ai2/oe-other
description: MainlineLadder final-midtrain five-size SGLang GPU qualification; MILES ce1d9564
tasks:
  - name: hybrid-sglang-five-sizes
    image:
      beaker: 01M5ZA7AP531QVWGSAGSC8M5B8
    command: [/bin/bash, -c]
    arguments:
      - >-
        set -euo pipefail;
        nvidia-smi;
        python -c 'import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name()); x=torch.randn(128,128,device="cuda",dtype=torch.bfloat16); assert (x@x).isfinite().all()';
        python tools/hybrid/qualify_sglang.py --size all --output-dir /weka/oe-adapt-default/michaeln/open-instruct-hybrid/qualification/rhea-ce1d9564 --mirror-dir /results/hybrid
    datasets:
      - mountPath: /weka/oe-training-default
        source:
          weka: oe-training-default
      - mountPath: /weka/oe-adapt-default
        source:
          weka: oe-adapt-default
    result:
      path: /results
    resources:
      gpuCount: 1
      cpuCount: 12
      memory: 96 GiB
      sharedMemory: 16 GiB
    context:
      priority: normal
      minRuntime: 0s
    constraints:
      cluster: [ai2/rhea]
    timeout: 2h
    hostNetworking: true
retry:
  allowedTaskRetries: 0
